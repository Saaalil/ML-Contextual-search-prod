name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "Error: HF_SPACE is not set in GitHub Variables or Secrets."
            exit 1
          fi
          git remote set-url hf https://oauth2:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE || git remote add hf https://oauth2:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE
          git push hf main --force
